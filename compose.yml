name: resilient-ws-gateway
services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    ports: ['127.0.0.1:6387:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 1s
      retries: 20
  gateway-a:
    build: .
    environment:
      INSTANCE: gateway-a
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Run npm run stack:up first}
    ports: ['127.0.0.1:8081:8080']
    depends_on:
      redis: {condition: service_healthy}
  gateway-b:
    build: .
    environment:
      INSTANCE: gateway-b
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Run npm run stack:up first}
    ports: ['127.0.0.1:8082:8080']
    depends_on:
      redis: {condition: service_healthy}
  proxy:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [gateway-a, gateway-b]
volumes:
  redis-data:
